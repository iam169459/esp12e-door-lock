name: Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade pip && pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Validate version format
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION (expected semver like v1.2.3)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build firmware
        run: pio run -e esp12e
        env:
          FIRMWARE_VERSION: ${{ env.VERSION }}

      - name: Verify firmware size
        run: |
          SIZE=$(stat -c%s .pio/build/esp12e/firmware.bin)
          MAX_SIZE=1044464
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "Firmware too large: $SIZE bytes (max $MAX_SIZE)"
            exit 1
          fi
          echo "Firmware size: $SIZE bytes (OK)"

      - name: Create release asset
        run: cp .pio/build/esp12e/firmware.bin firmware-${{ env.VERSION }}.bin

      - name: Generate changelog
        run: |
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG.md || echo "No previous tag" > CHANGELOG.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-${{ env.VERSION }}.bin
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}